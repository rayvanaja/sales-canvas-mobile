name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependency npm
        run: npm install

      - name: Sinkronkan Capacitor
        run: npx cap sync android

      - name: Beri izin eksekusi gradlew
        run: chmod +x android/gradlew

      - name: Decode kunci rilis dari GitHub Secret
        working-directory: android/app
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Compile APK (release, ditandatangani kunci rilis)
        working-directory: android
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: sales-canvas-apk
          path: android/app/build/outputs/apk/release/app-release.apk
